<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Signal Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230f1419'/><circle cx='16' cy='16' r='3' fill='%2322d3ee'/><path d='M9 23a10 10 0 0 1 0-14M23 9a10 10 0 0 1 0 14' stroke='%2322d3ee' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">
<style>
:root {
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f0f2f5; --ink:#0f1419; --ink-2:#384150; --muted:#6b7280;
  --line:#e4e7ec; --shadow:0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.05);
  --make:#e5484d; --test:#f76b15; --important:#d99a06; --watch:#8e4ec6; --study:#0090ff; --know:#3e63dd;
  --skip:#8b8d98; --pending:#6f7a8e; --stale:#a18072; --comp:#12a594; --ok:#30a46c;
  --accent:#22d3ee; --radius:14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0b0d12; --surface:#151821; --surface-2:#1d2130; --ink:#eef0f4; --ink-2:#c6ccd6; --muted:#8f97a6;
    --line:#262b38; --shadow:none; --important:#f5b82e; --know:#7c93f0; --skip:#80838f; --pending:#8e98ab;
  }
}
:root[data-theme="dark"] {
  --bg:#0b0d12; --surface:#151821; --surface-2:#1d2130; --ink:#eef0f4; --ink-2:#c6ccd6; --muted:#8f97a6;
  --line:#262b38; --shadow:none; --important:#f5b82e; --know:#7c93f0; --skip:#80838f; --pending:#8e98ab;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:inherit; }
button { font:inherit; color:inherit; }
svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
svg.sm { width:14px; height:14px; }
.app { display:flex; min-height:100vh; }
.col { flex:1; min-width:0; }

/* ---------- mobile header + bottom nav ---------- */
.top { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
  padding:max(10px, env(safe-area-inset-top)) 16px 0; }
.brand { display:flex; align-items:center; gap:10px; }
.logo { width:32px; height:32px; border-radius:10px; background:#0f1419; display:grid; place-items:center; flex-shrink:0; }
.logo svg { width:20px; height:20px; }
.brand b { font-size:17px; letter-spacing:-.01em; }
.brand .upd { font-size:12px; color:var(--muted); line-height:1.3; }
.iconbtn { margin-left:auto; width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
  display:grid; place-items:center; cursor:pointer; color:var(--ink-2); }
.niches { display:flex; gap:8px; overflow-x:auto; padding:10px 0 12px; scrollbar-width:none; }
.niches::-webkit-scrollbar, .scroll::-webkit-scrollbar, .seg::-webkit-scrollbar { display:none; }
.npill { display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 13px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); white-space:nowrap; cursor:pointer; font-size:14px; font-weight:550; color:var(--ink-2); }
.npill.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.dot { width:9px; height:9px; border-radius:50%; background:var(--c); flex-shrink:0; }
.count { font-size:11.5px; font-weight:650; padding:1px 7px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
.npill.on .count { background:color-mix(in srgb, var(--bg) 22%, transparent); color:var(--bg); }
.bottom { position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(6,1fr);
  background:color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
.bottom button { border:0; background:none; padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; font-weight:550; color:var(--muted); cursor:pointer; position:relative; }
.bottom button.on { color:var(--ink); }
.bottom button.on::before { content:""; position:absolute; top:0; left:30%; right:30%; height:3px; border-radius:0 0 3px 3px; background:var(--accent); }
.bottom .badge-n { position:absolute; top:5px; left:calc(50% + 6px); font-size:10px; background:var(--make); color:#fff; border-radius:999px; padding:0 5px; }

/* ---------- desktop sidebar ---------- */
.side { display:none; }
main { padding:16px 16px calc(92px + env(safe-area-inset-bottom)); max-width:1080px; margin:0 auto; }
@media (min-width: 920px) {
  .top, .bottom { display:none; }
  .side { display:flex; flex-direction:column; gap:4px; width:268px; flex-shrink:0; position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--surface); border-right:1px solid var(--line); padding:20px 14px; }
  .side .brand { padding:0 8px 18px; }
  .side h6 { margin:16px 10px 6px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .sbtn { display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border-radius:10px; border:0; background:none; cursor:pointer;
    text-align:left; font-size:14.5px; font-weight:550; color:var(--ink-2); }
  .sbtn:hover { background:var(--surface-2); }
  .sbtn.on { background:var(--surface-2); color:var(--ink); box-shadow:inset 3px 0 0 var(--accent); }
  .sbtn .count { margin-left:auto; }
  .sbtn .count.red { background:var(--make); color:#fff; }
  .side .foot { margin-top:auto; padding:14px 10px 0; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); }
  .side .foot p { margin:0 0 8px; }
  .side .foot code { background:var(--surface-2); padding:1px 6px; border-radius:5px; color:var(--ink-2); }
  .themebtn { display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:10px;
    padding:7px 10px; cursor:pointer; font-size:13px; color:var(--ink-2); margin-top:6px; }
  main { padding:30px 36px 60px; }
}

/* ---------- page header ---------- */
.ph { margin:4px 0 18px; }
.ph h1 { margin:0; font-size:24px; letter-spacing:-.02em; line-height:1.2; }
.ph p { margin:4px 0 0; color:var(--muted); font-size:14px; }
@media (min-width: 920px) { .ph h1 { font-size:28px; } }
.note { color:var(--muted); margin:12px 2px 0; font-size:14px; }
.note code { background:var(--surface-2); padding:1px 7px; border-radius:6px; font-size:13px; color:var(--ink); }

/* ---------- controls ---------- */
.filters { display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
@media (min-width: 920px) { .filters { position:sticky; top:0; z-index:10; background:var(--bg); padding:10px 0 12px; margin-top:-10px; } }
.scroll { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:1px; }
@media (min-width: 920px) { .scroll { flex-wrap:wrap; } }
.chip { display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); white-space:nowrap; cursor:pointer; font-size:13.5px; font-weight:550; color:var(--ink-2); text-decoration:none; }
.chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.chip .n { font-size:12px; opacity:.65; font-weight:600; }
.chip .av { width:18px; height:18px; font-size:10px; border-radius:5px; }
.seg { display:inline-flex; background:var(--surface-2); border-radius:11px; padding:3px; gap:2px; max-width:100%; overflow-x:auto; scrollbar-width:none; }
.seg button { border:0; background:none; padding:6px 11px; border-radius:8px; font-size:13.5px; font-weight:550; color:var(--muted); cursor:pointer; white-space:nowrap; }
.seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
@media (max-width: 919px) { .bar .seg:first-child { width:100%; } .bar .seg:first-child button { flex:1; padding:6px 4px; } }
.search { flex:1; min-width:200px; display:flex; align-items:center; gap:8px; height:40px; padding:0 12px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted); }
.search input { flex:1; min-width:0; border:0; outline:0; background:none; color:var(--ink); font-size:15px; }
.dates { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
.dates input { height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:0 8px; font:inherit; font-size:13px; }

/* ---------- overview ---------- */
.tiles { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
@media (min-width: 720px) { .tiles { grid-template-columns:repeat(4, 1fr); gap:14px; } }
.tile { text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:14px; cursor:pointer;
  box-shadow:var(--shadow); position:relative; overflow:hidden; }
.tile::after { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--lc); }
.tile .num { font-size:28px; font-weight:750; letter-spacing:-.02em; line-height:1.1; }
.tile .lbl { font-size:13.5px; font-weight:650; margin-top:2px; }
.tile .sub { font-size:12px; color:var(--muted); }
.sec { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:30px 2px 12px; }
.sec h2 { margin:0; font-size:18px; letter-spacing:-.01em; }
.sec button { border:0; background:none; color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer; padding:0; white-space:nowrap; }
.grid { display:grid; grid-template-columns:1fr; gap:12px; }
@media (min-width: 720px) { .grid.two { grid-template-columns:repeat(2, 1fr); } .grid.three { grid-template-columns:repeat(3, 1fr); } }
.stack, .cards { display:flex; flex-direction:column; gap:10px; }
@media (min-width: 920px) {
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:14px; }
  .list.rows { display:grid; grid-template-columns:repeat(2, 1fr); column-gap:28px; }
  .list.rows .ritem { border-bottom:1px solid var(--line); }
}
.tag.imp4 { background:color-mix(in srgb, var(--important) 16%, transparent); color:var(--important); font-weight:700; }
.tag.imp5 { background:var(--important); color:#fff; font-weight:750; }
.ever b { font-size:11px; font-weight:600; color:var(--muted); margin-right:3px; }

.banner { display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:var(--radius); margin-bottom:16px;
  background:color-mix(in srgb, var(--tone, var(--pending)) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--tone, var(--pending)) 28%, var(--line)); }
.banner .ic { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex-shrink:0;
  background:color-mix(in srgb, var(--tone, var(--pending)) 18%, transparent); color:var(--tone, var(--pending)); }
.banner b { display:block; font-size:15px; }
.banner p { margin:2px 0 0; color:var(--ink-2); font-size:14px; }
.banner code, .empty code { background:var(--surface-2); padding:1px 7px; border-radius:6px; font-size:13px; color:var(--ink); }
.link { border:0; background:none; padding:0; color:var(--ink); font-weight:650; text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:14px; }

.empty { text-align:center; padding:36px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); color:var(--muted); }
.empty h3 { color:var(--ink); margin:10px 0 6px; font-size:18px; }
.empty ol { text-align:left; display:inline-block; margin:8px auto 16px; padding-left:20px; color:var(--ink-2); }
.empty ol li { margin:4px 0; }
.btn { display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; }
.btn.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }

/* ---------- cards ---------- */
.card { position:relative; display:flex; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 14px 14px 16px; box-shadow:var(--shadow); min-width:0; }
.card::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:4px; border-radius:0 4px 4px 0; background:var(--lc); }
.card .body { flex:1; min-width:0; }
.card.hero { flex-direction:column; gap:0; padding:0; overflow:hidden; }
.card.hero::before { top:0; bottom:auto; left:0; right:0; width:auto; height:4px; border-radius:0; z-index:1; }
.card.hero .body { padding:14px 16px 16px; }
.badges { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:7px; }
.badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:750; letter-spacing:.05em; text-transform:uppercase;
  padding:3px 8px; border-radius:6px; color:#fff; background:var(--lc); }
.badge.ghost { background:none; color:var(--pending); border:1px dashed color-mix(in srgb, var(--pending) 60%, transparent); padding:2px 7px; }
.tag { font-size:12px; font-weight:550; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-2); }
.tag.now { background:color-mix(in srgb, var(--make) 14%, transparent); color:var(--make); font-weight:750; }
.tag.soon { background:color-mix(in srgb, var(--important) 16%, transparent); color:var(--important); font-weight:700; }
.ever { display:inline-flex; gap:3px; align-items:center; padding:0 2px; }
.ever i { width:6px; height:6px; border-radius:50%; background:var(--line); }
.ever i.f { background:var(--ok); }
.title { font-size:16px; font-weight:650; line-height:1.38; color:var(--ink); text-decoration:none; display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden; letter-spacing:-.005em; }
.title:hover { text-decoration:underline; text-underline-offset:3px; }
.hero .title { font-size:17px; }
.summary { margin:7px 0 0; color:var(--ink-2); font-size:14.5px; line-height:1.5; }
.snippet { margin:5px 0 0; color:var(--muted); font-size:13.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.flags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.flag { font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); background:var(--bg); }
.meta { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:10px; font-size:12.5px; color:var(--muted); }
.meta .src { display:inline-flex; align-items:center; gap:7px; font-weight:600; color:var(--ink-2); }
.meta a { color:var(--muted); }
.av { width:20px; height:20px; border-radius:6px; display:inline-grid; place-items:center; font-size:11px; font-weight:750; color:#fff; flex-shrink:0; }
.thumb { flex-shrink:0; width:92px; height:70px; border-radius:10px; overflow:hidden; background:var(--surface-2); display:block; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.hero .thumb { width:100%; height:auto; aspect-ratio:16/9; border-radius:0; }
@media (min-width: 920px) { .card:not(.hero) .thumb { width:168px; height:100px; } }

.list { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:2px 14px; box-shadow:var(--shadow); }
.ritem { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
.ritem:last-child { border-bottom:0; }
.ritem .rb { flex:1; min-width:0; }
.ritem .rt { font-size:14.5px; font-weight:600; color:var(--ink); text-decoration:none; line-height:1.38; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.ritem .meta { margin-top:4px; }
.ritem .thumb { width:64px; height:48px; border-radius:8px; }
.ritem > .av { margin-top:2px; width:28px; height:28px; border-radius:8px; font-size:13px; }
.day { font-size:12px; font-weight:750; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:24px 4px 10px; display:flex; align-items:center; gap:10px; }
.day::after { content:""; flex:1; height:1px; background:var(--line); }

/* ---------- manual + sources ---------- */
.mcard { display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
.mcard .mi { width:40px; height:40px; border-radius:11px; display:grid; place-items:center; font-weight:800; font-size:15px; color:#fff; flex-shrink:0; }
.mcard .mb { flex:1; min-width:0; }
.mcard b { display:block; font-size:15px; }
.mcard p { margin:3px 0 10px; color:var(--muted); font-size:13.5px; }
.srow { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
.srow:last-child { border-bottom:0; }
.sdot { width:10px; height:10px; border-radius:50%; margin-top:6px; flex-shrink:0; }
.srow .sb { flex:1; min-width:0; }
.srow b { font-size:14.5px; }
.srow .sm { font-size:12.5px; color:var(--muted); }
.srow .err { font-size:12.5px; color:var(--make); margin-top:2px; word-break:break-word; }
.srow .sn { text-align:right; font-size:12px; color:var(--muted); white-space:nowrap; }
.srow .sn b { display:block; font-size:16px; color:var(--ink); }
.pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.loading { padding:60px 0; text-align:center; color:var(--muted); }
.dbtn { border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:8px; padding:4px 10px; font-size:12.5px; font-weight:650; cursor:pointer; }
.dbtn:hover { background:var(--line); }
.modal { position:fixed; inset:0; z-index:100; background:rgba(8,10,14,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
.sheet { position:relative; width:100%; max-width:760px; background:var(--surface); border-radius:18px; padding:22px 22px 26px; box-shadow:0 30px 80px rgba(0,0,0,.35); }
.sheet .x { position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; font-size:18px; color:var(--ink); }
.sheet h2 { margin:6px 44px 6px 0; font-size:21px; line-height:1.3; letter-spacing:-.01em; }
.sheet h4 { margin:20px 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.sheet p { margin:0; color:var(--ink-2); font-size:15px; line-height:1.55; white-space:pre-wrap; }
.sheet ul { margin:0; padding-left:20px; color:var(--ink-2); font-size:15px; line-height:1.55; }
.sheet li { margin:3px 0; }
.sheet .acts li::marker { content:"✓  "; color:var(--ok); }
.sheet .row2 { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
@media (max-width: 919px) { .modal { padding:0; align-items:stretch; } .sheet { border-radius:0; min-height:100%; padding-top:18px; } }
.bg { margin:8px 0 0; font-size:13.5px; color:var(--ink-2); background:var(--surface-2); border-radius:8px; padding:7px 10px; }
.bg a { color:var(--ink); font-weight:600; }
.outline { margin:10px 0 0; padding-left:20px; color:var(--ink-2); font-size:14px; }
.outline li { margin:3px 0; }
.based { margin-top:10px; font-size:13px; color:var(--muted); }
.based a { display:block; color:var(--ink-2); text-decoration:none; padding:3px 0; }
.based a:hover { text-decoration:underline; }
.idea .title { cursor:default; }
.hint { font-size:12px; color:var(--muted); margin-top:10px; }
.hint code { background:var(--surface-2); padding:1px 6px; border-radius:5px; }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="col">
    <header class="top" id="top"></header>
    <main id="main"><div class="loading">Loading…</div></main>
  </div>
</div>
<nav class="bottom" id="bottom" aria-label="Views"></nav>

<script>
const ICON = {
  logo: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4" fill="#22d3ee"/><path d="M6.5 17.5a7.8 7.8 0 0 1 0-11M17.5 6.5a7.8 7.8 0 0 1 0 11" stroke="#22d3ee" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
  overview: '<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',
  feed: '<path d="M5 6h14M5 12h14M5 18h9"/>',

const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICON[n]}</svg>`;

// label -> [display name, color, short meaning]
const LABELS = {
  MAKE: ['Make', 'var(--make)', 'Make a video'], TEST: ['Test', 'var(--test)', 'Try it first'],
  IMPORTANT: ['Important', 'var(--important)', 'Big news'], WATCH: ['Watch', 'var(--watch)', 'Still developing'],
  STUDY: ['Study', 'var(--study)', 'Learn later'], KNOW: ['Know', 'var(--know)', 'Good to know'],

  PRACTICE: ['Practice', 'var(--comp)'], CONTENT: ['Content', 'var(--comp)'],

const RANK = ['MAKE','TEST','IMPORTANT','WATCH','RELEASE','FEATURE','DECISION','CONTENT','PRACTICE','STUDY','KNOW','PENDING','SKIP','STALE'];
const TIMING = { NOW: ['Post now', 'now', 0], SOON: ['This week', 'soon', 1], ANYTIME: ['Anytime', '', 2] };
const VIEWS = [['overview','Overview'], ['ideas','Video ideas'], ['feed','Feed'], ['competitors','Competitors'], ['manual','Check manually'], ['sources','Sources']];
const SHORT = { overview:'Home', ideas:'Ideas', feed:'Feed', competitors:'Rivals', manual:'Manual', sources:'Sources' };
const DATES = [['today','Today'], ['yesterday','Yesterday'], ['week','Week'], ['month','Month'], ['custom','Custom']];

const S = { entity:null, view:'overview', date:'week', from:'', to:'', label:'ALL', q:'', sort:'latest', comp:'ALL', istatus:'OPEN', itype:'ALL' };
let META = null; const DATA = {}; const IDEAS = {};

// ---------- helpers ----------
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe = u => /^https?:\/\//i.test(u || '') ? u : '#';
const attr = o => esc(JSON.stringify(o));
const human = s => (s ?? '').toString().replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
const ist = d => new Date(new Date(d).getTime() + 330 * 60000).toISOString().slice(0, 10);
const dayAgo = n => ist(Date.now() - n * 864e5);
const lab = it => it.status === 'pending' ? 'PENDING' : it.status === 'stale' ? 'STALE' : it.label;
const when = it => it.when || it.found_at;
const newest = (a, b) => (when(b) || '').localeCompare(when(a) || '');
const compact = n => new Intl.NumberFormat('en', { notation:'compact', maximumFractionDigits:1 }).format(n);
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function rel(d) {
  if (!d) return 'never';
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  if (s < 7 * 86400) return Math.round(s / 86400) + 'd ago';
  return new Date(d).toLocaleDateString('en-IN', { day:'numeric', month:'short', timeZone:'Asia/Kolkata' });
}
function dayName(d) {
  return d === dayAgo(0) ? 'Today' : d === dayAgo(1) ? 'Yesterday'
    : new Date(d + 'T12:00:00Z').toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'short' });
}
function hue(s) { let h = 0; for (const c of s || '') h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const av = name => `<span class="av" style="background:hsl(${hue(name)} 52% 46%)">${esc((name || '?').replace(/^r\//, '').charAt(0).toUpperCase())}</span>`;
function inRange(it, range = S.date) {
  const d = ist(when(it));
  if (range === 'today') return d === dayAgo(0);
  if (range === 'yesterday') return d === dayAgo(1);
  if (range === 'week') return d >= dayAgo(6);
  if (range === 'month') return d >= dayAgo(29);
  if (range === 'custom') return (!S.from || d >= S.from) && (!S.to || d <= S.to);

}
const ent = () => META.entities.find(e => e.id === S.entity);
const items = () => DATA[S.entity] || [];

const news = () => items().filter(it => it.role !== 'competitor' || (it.status === 'analyzed' && !['SKIP', 'STALE'].includes(it.label)));
const rivals = () => items().filter(it => it.role === 'competitor' && (S.comp === 'ALL' || it.competitor_id === S.comp));
const useful = it => it.status === 'analyzed' && !['SKIP', 'STALE'].includes(it.label);
const imp = it => it.importance || (it.label === 'IMPORTANT' ? 4 : 0);
const isImp = it => useful(it) && imp(it) >= 4;
const IMPNAME = { 5:'High', 4:'High', 3:'Medium', 2:'Low', 1:'Low' };
const desk = matchMedia('(min-width: 920px)');
const cardMode = () => desk.matches ? 'hero' : 'normal';
function byPriority(a, b) {
  return (RANK.indexOf(lab(a)) - RANK.indexOf(lab(b))) || (imp(b) - imp(a)) || ((TIMING[a.timing]?.[2] ?? 3) - (TIMING[b.timing]?.[2] ?? 3))
    || ((b.evergreen || 0) - (a.evergreen || 0)) || newest(a, b);
}

// ---------- pieces ----------
function flagChips(it) {

    .sort(([a], [b]) => (a === 'category' ? -1 : b === 'category' ? 1 : 0))
    .map(([k, v]) => {
      const text = v === true ? human(k) : k === 'category' ? human(v)
        : defs[k]?.type === 'date' ? 'Anniversary ' + new Date(v + 'T12:00:00Z').toLocaleDateString('en-IN', { day:'numeric', month:'short' })
        : `${human(k)}: ${human(v)}`;

    }).join('');
}
function stats(it) {

  if (m.points) out.push(compact(m.points) + ' points');
  if (m.upvotes) out.push(compact(m.upvotes) + ' upvotes');
  if (m.reactions) out.push(compact(m.reactions) + ' reactions');
  if (m.stars_today) out.push('★ ' + compact(m.stars_today) + ' today');
  if (m.comments) out.push(compact(m.comments) + ' comments');
  return out.map(s => `<span>${esc(s)}</span>`).join('');
}
function srcName(it) {
  if (!it.competitor_id) return it.source;

}
function badgeFor(L) {
  const [name, color] = LABELS[L] || [L, 'var(--skip)'];
  return L === 'PENDING' ? `<span class="badge ghost">${ic('clock', 'sm')}Waiting</span>`
    : `<span class="badge" style="--lc:${color}">${esc(name)}</span>`;
}
const img = (it, cls) => `<a class="${cls}" href="${esc(safe(it.url))}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
  <img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>`;
function card(it, mode = 'normal') {
  const L = lab(it), color = (LABELS[L] || [])[1] || 'var(--skip)', src = srcName(it), m = it.meta || {};

  if (it.timing && TIMING[it.timing]) b.push(`<span class="tag ${TIMING[it.timing][1]}">${TIMING[it.timing][0]}</span>`);
  if (imp(it) && L !== 'IMPORTANT') b.push(`<span class="tag ${imp(it) >= 4 ? 'imp' + imp(it) : ''}" title="Importance ${imp(it)}/5">${IMPNAME[imp(it)]} importance</span>`);
  if (it.evergreen) b.push(`<span class="ever" title="Evergreen ${it.evergreen}/5: how long the video stays useful"><b>Evergreen</b>${[1,2,3,4,5].map(n => `<i class="${n <= it.evergreen ? 'f' : ''}"></i>`).join('')}</span>`);
  if (it.type === 'search_demand') b.push(`<span class="tag soon" title="What people in India are searching on Google and YouTube">🔎 Search demand</span>`);
  if (it.reason) b.push(`<span class="tag">${esc(human(it.reason))}</span>`);
  const snip = it.snippet && !it.snippet.startsWith((it.title || '').slice(0, 30)) ? it.snippet : '';
  const text = it.summary ? `<p class="summary">${esc(it.summary)}</p>` : snip ? `<p class="snippet">${esc(snip)}</p>` : '';
  const prev = it.follows ? items().find(x => x.id === it.follows) : null;
  const follow = it.follows ? `<p class="bg">↳ Follow-up${prev ? ` of <a href="${esc(safe(prev.url))}" target="_blank" rel="noopener">${esc(prev.title.slice(0, 90))}</a>` : ''}${it.background ? ': ' + esc(it.background) : ''}</p>` : '';
  const flags = flagChips(it);
  const links = (m.discussion ? `<a href="${esc(safe(m.discussion))}" target="_blank" rel="noopener">discussion</a>` : '')
    + (m.github ? `<a href="${esc(safe(m.github))}" target="_blank" rel="noopener">code</a>` : '');
  const hero = mode === 'hero' && it.image;
  return `<article class="card ${hero ? 'hero' : ''}" style="--lc:${color}">
    ${hero ? img(it, 'thumb') : ''}
    <div class="body">
      <div class="badges">${b.join('')}</div>
      <a class="title" href="${esc(safe(it.url))}" target="_blank" rel="noopener">${esc(it.title || it.url)}</a>
      ${text}
      ${follow}
      ${flags ? `<div class="flags">${flags}</div>` : ''}
      <div class="meta"><span class="src">${av(src)}${esc(src)}</span><span>${rel(when(it))}</span>${stats(it)}${links}${(it.status === 'analyzed' || it.snippet) ? `<button class="dbtn" data-detail="${esc(it.id)}">Details</button>` : ''}</div>
    </div>
    ${!hero && it.image ? img(it, 'thumb') : ''}
  </article>`;
}
function row(it) {
  const src = srcName(it), L = lab(it);
  return `<div class="ritem">${av(src)}
    <div class="rb"><a class="rt" href="${esc(safe(it.url))}" target="_blank" rel="noopener">${esc(it.title || it.url)}</a>
      <div class="meta">${L !== 'PENDING' ? badgeFor(L) : ''}<span class="src">${esc(src)}</span><span>${rel(when(it))}</span>${stats(it)}</div></div>

// ---------- chrome (header, sidebar, bottom nav) ----------
const updatedText = e => `Collected ${rel(e.last_collect)} · Analysed ${rel(e.last_analysis)}`;

// ---------- views ----------
const pageHead = (title, sub) => `<div class="ph"><h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}</div>`;
function waitingBanner(n) {

    <button class="link" data-set="${attr({ view:'feed', label:'PENDING', date:'week' })}">See them</button></p></div></div>`;
}
function viewOverview() {
  const e = ent(), all = news();
  const wk = all.filter(it => it.status === 'analyzed' && inRange(it, 'week'));
  const count = ls => wk.filter(it => ls.includes(it.label)).length;
  const pending = items().filter(it => it.status === 'pending').length;
  const analysedAny = items().some(it => it.status === 'analyzed');
  const tiles = [
    ['To make', count(['MAKE', 'TEST']), 'var(--make)', 'MAKE', 'video ideas this week'],
    ['Important', wk.filter(isImp).length, 'var(--important)', 'IMP', 'must-know news this week'],

    <div class="num">${n}</div><div class="lbl">${l}</div><div class="sub">${sub}</div></button>`).join('');
  let html = pageHead(e.name, esc(e.niche)) + waitingBanner(pending) + `<div class="tiles">${tiles}</div>`;

  const openIdeas = ideas().filter(i => ['new', 'to_make'].includes(i.status));

    html += `<div class="sec"><h2>Video ideas</h2><button data-set="${attr({ view:'ideas' })}">All ${openIdeas.length} →</button></div>

  }

      <h3>Nothing analysed yet</h3>

      <div class="cards">${comp.slice(0, 6).map(it => card(it, 'hero')).join('')}</div>`;
  }

      <div class="scroll">${e.manual.filter(m => !m.sweep).slice(0, 8).map(m => `<a class="chip" href="${esc(safe(m.url))}" target="_blank" rel="noopener">${esc(m.name)}${ic('open', 'sm')}</a>`).join('')}</div>`;
  }

}
const ITYPE = { hype: ['Hype now', 'var(--make)', 'Only works while the news is hot'], months: ['For months', 'var(--know)', 'Stays useful for weeks or months'], evergreen: ['Evergreen', 'var(--ok)', 'Works any time'] };
const ISTATUS = { new: 'New', to_make: 'To make', made: 'Made', skipped: 'Skipped' };
const ideas = () => IDEAS[S.entity] || [];
function ideaCard(i) {

    ${based.length ? `<div class="based"><b>Based on</b>${based.map(x => `<a href="${esc(safe(x.url))}" target="_blank" rel="noopener">• ${esc(x.title.slice(0, 110))} <span class="sub">(${esc(srcName(x))})</span></a>`).join('')}</div>` : ''}
    <div class="hint">${rel(i.created_at)} · ${i.status_note ? esc(i.status_note) + ' · ' : ''}to update, tell Antigravity: <code>idea ${esc(i.id)} made</code> / <code>skipped</code> / <code>to make</code></div>

function viewIdeas() {

  const st = i => S.istatus === 'ALL' || (S.istatus === 'OPEN' ? ['new', 'to_make'].includes(i.status) : i.status === S.istatus);
  const ty = i => S.itype === 'ALL' || i.type === S.itype;
  const count = f => list.filter(f).length;
  const schips = [['OPEN', 'Open'], ['new', 'New'], ['to_make', 'To make'], ['made', 'Made'], ['skipped', 'Skipped'], ['ALL', 'All']]
    .map(([k, l]) => `<button class="chip ${S.istatus === k ? 'on' : ''}" data-set="${attr({ istatus:k })}">${l}<span class="n">${count(i => k === 'ALL' || (k === 'OPEN' ? ['new', 'to_make'].includes(i.status) : i.status === k))}</span></button>`).join('');
  const tchips = [['ALL', 'All types', null], ...Object.entries(ITYPE).map(([k, v]) => [k, v[0], v[1]])]
    .map(([k, l, c]) => `<button class="chip ${S.itype === k ? 'on' : ''}" data-set="${attr({ itype:k })}" title="${esc((ITYPE[k] || [])[2] || '')}">${c ? `<span class="dot" style="--c:${c}"></span>` : ''}${l}<span class="n">${count(i => st(i) && (k === 'ALL' || i.type === k))}</span></button>`).join('');
  const shown = list.filter(i => st(i) && ty(i));
  return pageHead('Video ideas', `${esc(e.name)} · suggested by the AI after each run`)
    + `<div class="filters"><div class="scroll">${schips}</div><div class="scroll">${tchips}</div></div>`
    + (shown.length ? `<div class="cards" style="margin-top:12px">${shown.map(ideaCard).join('')}</div>` : `<div class="empty" style="margin-top:12px">No ideas for this filter.</div>`);
}
function notesHtml(t) {
  const lines = (t || '').split('\n');
  let out = '', list = [];
  const flush = () => { if (list.length) { out += `<ul>${list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; list = []; } };
  for (const l of lines) {
    const m = l.match(/^\s*[-*•]\s+(.*)/);
    if (m) list.push(m[1]); else { flush(); if (l.trim()) out += `<p>${esc(l)}</p>`; }
  }
  flush();
  return out;
}
function openDetail(id) {
  const it = items().find(x => x.id === id);
  if (!it) return;
  const L = lab(it), color = (LABELS[L] || [])[1] || 'var(--skip)';
  const prev = it.follows ? items().find(x => x.id === it.follows) : null;
  const b = [badgeFor(L)];
  if (imp(it)) b.push(`<span class="tag ${imp(it) >= 4 ? 'imp' + imp(it) : ''}">${IMPNAME[imp(it)]} importance</span>`);
  if (it.timing && TIMING[it.timing]) b.push(`<span class="tag ${TIMING[it.timing][1]}">${TIMING[it.timing][0]}</span>`);
  if (it.type === 'search_demand') b.push('<span class="tag soon">🔎 Search demand</span>');
  if (it.reason) b.push(`<span class="tag">${esc(human(it.reason))}</span>`);
  const flags = flagChips(it);
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="sheet" style="border-top:5px solid ${color}">
    <button class="x" data-close aria-label="Close">✕</button>
    <div class="badges">${b.join('')}</div>
    <h2>${esc(it.title)}</h2>
    <div class="meta"><span class="src">${av(srcName(it))}${esc(srcName(it))}</span><span>${rel(when(it))}</span>${stats(it)}</div>
    ${it.image ? `<img src="${esc(it.image)}" alt="" referrerpolicy="no-referrer" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-top:14px" onerror="this.remove()">` : ''}
    ${it.summary ? `<h4>Summary</h4><p>${esc(it.summary)}</p>` : ''}
    ${it.follows || it.background ? `<h4>Back-story</h4><p>${prev ? 'Follow-up of: ' + esc(prev.title) + '\n' : ''}${esc(it.background || '')}</p>` : ''}
    ${it.notes ? `<h4>Observations</h4>${notesHtml(it.notes)}` : ''}
    ${(it.actions || []).length ? `<h4>What the AI did</h4><ul class="acts">${it.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
    ${!it.summary && !it.notes && it.snippet ? `<h4>From the source</h4><p>${esc(it.snippet)}</p>` : ''}
    ${flags ? `<h4>Tags</h4><div class="flags">${flags}</div>` : ''}
    <div class="row2"><a class="btn primary" href="${esc(safe(it.url))}" target="_blank" rel="noopener">Open original ${ic('open', 'sm')}</a>
      ${it.analyzed_at ? `<span class="sub" style="align-self:center">Analysed ${rel(it.analyzed_at)}</span>` : '<span class="sub" style="align-self:center">Not analysed yet</span>'}</div>
  </div>`;
  document.body.appendChild(m);
  document.body.style.overflow = 'hidden';
}
function closeDetail() { document.querySelectorAll('.modal').forEach(x => x.remove()); document.body.style.overflow = ''; }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDetail(); });
function filterBar(base, labelList) {
  const counts = {};
  base.filter(it => inRange(it)).forEach(it => {
    const L = lab(it); counts[L] = (counts[L] || 0) + 1;
    if (useful(it)) counts.USEFUL = (counts.USEFUL || 0) + 1;
    if (isImp(it)) counts.IMP = (counts.IMP || 0) + 1;
    if (L !== 'SKIP' && L !== 'STALE') counts.ALL = (counts.ALL || 0) + 1;
    if (it.type === 'search_demand') counts.SEARCH = (counts.SEARCH || 0) + 1;
  });
  const chips = labelList.map(L => {
    const name = L === 'SEARCH' ? '🔎 Searches' : L === 'USEFUL' ? 'Analysed' : L === 'ALL' ? 'All news' : L === 'IMP' ? 'Important' : (LABELS[L] || [L])[0];
    const color = L === 'IMP' ? 'var(--important)' : (LABELS[L] || [])[1];
    return `<button class="chip ${S.label === L ? 'on' : ''}" data-set="${attr({ label:L })}" title="${esc((LABELS[L] || [])[2] || (L === 'USEFUL' ? 'Analysed by the AI, except Skipped' : L === 'ALL' ? 'Everything except Skipped' : L === 'IMP' ? 'Importance 4–5: news people need to know' : L === 'SEARCH' ? 'What people in India are searching on Google and YouTube, one entry per topic per day (NEW searches first)' : ''))}">
      ${color ? `<span class="dot" style="--c:${color}"></span>` : ''}${name}<span class="n">${counts[L] || 0}</span></button>`;
  }).join('');
  return `<div class="filters">
    <div class="bar"><div class="seg">${DATES.map(([k, l]) => `<button class="${S.date === k ? 'on' : ''}" data-set="${attr({ date:k })}">${l}</button>`).join('')}</div>
      <div class="seg">${[['latest', 'Latest'], ['priority', 'Priority']].map(([k, l]) => `<button class="${S.sort === k ? 'on' : ''}" data-set="${attr({ sort:k })}">${l}</button>`).join('')}</div></div>
    ${S.date === 'custom' ? `<div class="dates"><input type="date" id="from" value="${esc(S.from)}" aria-label="From date"> to <input type="date" id="to" value="${esc(S.to)}" aria-label="To date"></div>` : ''}
    <div class="scroll">${chips}</div>
    <label class="search">${ic('search')}<input id="q" type="search" placeholder="Search titles, sources, flags" value="${esc(S.q)}"></label>
  </div><div id="list"></div>`;
}
function matchQ(it) {
  if (!S.q) return true;
  const hay = [it.title, it.source, srcName(it), it.reason, it.summary, it.snippet, JSON.stringify(it.flags || {})].join(' ').toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function matchLabel(it) {
  if (S.label === 'SEARCH') return it.type === 'search_demand';
  if (S.label === 'USEFUL') return useful(it);
  if (S.label === 'IMP') return isImp(it);
  if (S.label === 'ALL') return lab(it) !== 'SKIP' && lab(it) !== 'STALE';
  return lab(it) === S.label;
}
function renderList() {
  const base = S.view === 'feed' ? news() : rivals();
  const list = base.filter(it => inRange(it) && matchLabel(it) && matchQ(it));
  const el = document.getElementById('list');
  if (!el) return;
  if (!list.length) {
    const pend = base.filter(it => it.status === 'pending' && inRange(it)).length;
    el.innerHTML = `<div class="empty" style="margin-top:14px"><h3>Nothing here</h3>
      <p>${S.label === 'USEFUL' && pend ? `${pend} items in this range are still waiting for analysis. Say <code>analyze today</code> in Antigravity.` : 'Try a wider date range or another label.'}</p>
      ${S.label !== 'PENDING' && pend ? `<button class="btn" data-set="${attr({ label:'PENDING' })}">Show ${pend} waiting</button> ` : ''}
      ${S.date !== 'month' ? `<button class="btn" data-set="${attr({ date:'month' })}">Last 30 days</button>` : ''}</div>`;
    return;
  }
  const rows = ['PENDING', 'SKIP', 'STALE'].includes(S.label) && S.view === 'feed';
  const intro = S.label === 'PENDING' ? `<p class="note">Collected but not analysed yet. They get labels when you say <code>analyze today</code> in Antigravity.</p>` : '';
  if (S.sort === 'priority') {
    list.sort(byPriority);
    el.innerHTML = intro + (rows ? `<div class="list rows" style="margin-top:12px">${list.map(row).join('')}</div>`
      : `<div class="cards" style="margin-top:12px">${list.map(it => card(it, cardMode())).join('')}</div>`);
  } else {
    list.sort(newest);
    el.innerHTML = intro + (rows ? grouped(list, row, 'list rows') : grouped(list, it => card(it, cardMode()), 'cards'));
  }
}
function viewFeed() {
  const e = ent();
  const labels = ['ALL', 'USEFUL', 'IMP', 'SEARCH', ...e.labels.filter(l => l !== 'SKIP' && l !== 'IMPORTANT').sort((a, b) => RANK.indexOf(a) - RANK.indexOf(b)), 'PENDING', 'SKIP', 'STALE'];
  return pageHead('Feed', `${esc(e.name)} · all collected news, newest first`) + filterBar(news(), labels);
}
function viewCompetitors() {
  const e = ent();
  if (!e.competitors.length) return pageHead('Competitors') + `<div class="empty"><h3>No competitors yet</h3><p>Say <code>add competitor &lt;name&gt; to ${esc(e.name)}</code> in Antigravity (max 5).</p></div>`;
  const all = items().filter(it => it.role === 'competitor' && inRange(it));
  const chips = [['ALL', 'All', all.length], ...e.competitors.map(c => [c.id, c.name, all.filter(it => it.competitor_id === c.id).length])]
    .map(([id, name, n]) => `<button class="chip ${S.comp === id ? 'on' : ''}" data-set="${attr({ comp:id })}">${id === 'ALL' ? '' : av(name)}${esc(name)}<span class="n">${n}</span></button>`).join('');
  return pageHead('Competitors', `${e.competitors.length} channels tracked for ${esc(e.name)}: their new videos and moves`)
    + `<div class="scroll" style="margin-bottom:12px">${chips}</div>`
    + filterBar(rivals(), ['ALL', ...[...e.competitor_labels].sort((a, b) => RANK.indexOf(a) - RANK.indexOf(b)), 'PENDING', 'SKIP']);
}
function viewManual() {
  const e = ent();
  const look = t => ({ x_manual: ['𝕏', '#111'], x_list: ['𝕏', '#111'], reddit_manual: ['r/', '#ff4500'], daily_dev: ['d.', '#6b4ce6'], instagram_manual: ['IG', '#d6249f'] }[t] || ['↗', '#3e63dd']);
  const tile = m => { const [g, c] = look(m.type); return `<div class="mcard">
      <span class="mi" style="background:${c}">${esc(g)}</span><div class="mb"><b>${esc(m.name)}</b><p>${esc(m.why || human(m.type))}</p>
      ${m.members && m.members.length ? `<div class="flags" style="margin:-4px 0 12px">${m.members.map(h => `<a class="flag" href="https://x.com/${encodeURIComponent(h)}" target="_blank" rel="noopener">@${esc(h)}</a>`).join('')}</div>` : ''}
      <a class="btn" href="${esc(safe(m.url))}" target="_blank" rel="noopener">${m.type === 'x_list' ? (/\/i\/lists\/\d/.test(m.url) ? 'Open this list' : 'Open my X lists') : 'Open'} ${ic('open', 'sm')}</a></div></div>`; };
  const ai = e.manual.filter(m => m.sweep), you = e.manual.filter(m => !m.sweep);
  if (!e.manual.length) return pageHead('Check manually') + '<div class="empty">No manual sources.</div>';
  return pageHead('Check manually', 'Sites that block automatic collection.')
    + (ai.length ? `<div class="sec"><h2>The AI reads these for you</h2></div>
      <p class="note" style="margin:-4px 2px 12px">Every “analyze today”, the AI opens these Reddit and X pages, picks the meaningful posts from the last 24 hours and adds them to the feed. You don’t need to check them.</p>
      <div class="grid two">${ai.map(tile).join('')}</div>` : '')
    + (you.some(m => m.type === 'x_list') ? `<div class="sec"><h2>Your X lists</h2></div>
      <p class="note" style="margin:-4px 2px 12px">Lists are separate timelines with only the accounts you add. Make each one <b>private</b>, add the accounts below (tap a name to open it; no need to follow), and pin the ones marked “pin this”. Your normal feed doesn’t change.</p>
      <div class="grid two">${you.filter(m => m.type === 'x_list').map(tile).join('')}</div>` : '')
    + (you.some(m => m.type !== 'x_list') ? `<div class="sec"><h2>Only you can check these</h2></div>
      <p class="note" style="margin:-4px 2px 12px">These need your login or an app. Have a look when you have a minute.</p>
      <div class="grid two">${you.filter(m => m.type !== 'x_list').map(tile).join('')}</div>` : '');
}
function viewSources() {
  const e = ent(), rows = [...e.sources].sort((a, b) => (b.broken - a.broken) || (b.errors - a.errors) || (b.new_7d - a.new_7d));
  const broken = rows.filter(s => s.broken).length, failing = rows.filter(s => s.errors && !s.broken).length;
  const color = s => s.broken ? 'var(--make)' : s.errors ? 'var(--important)' : s.status === 'paused' ? 'var(--skip)' : 'var(--ok)';
  return pageHead('Sources', `${rows.length} automatic sources for ${esc(e.name)}`)
    + `<div class="pills"><span class="chip"><span class="dot" style="--c:var(--ok)"></span>Working<span class="n">${rows.length - broken - failing}</span></span>
       <span class="chip"><span class="dot" style="--c:var(--important)"></span>Failed last run<span class="n">${failing}</span></span>
       <span class="chip"><span class="dot" style="--c:var(--make)"></span>Broken<span class="n">${broken}</span></span></div>`
    + (broken ? `<div class="banner" style="--tone:var(--make)"><span class="ic">${ic('sources')}</span><div><b>${broken} broken source${broken > 1 ? 's' : ''}</b><p>Say <code>fix sources</code> in Antigravity.</p></div></div>` : '')
    + `<div class="list">${rows.map(s => `<div class="srow"><span class="sdot" style="background:${color(s)}"></span>
      <div class="sb"><b>${esc(s.name)}</b><div class="sm">${esc(human(s.type))} · ${esc(s.role)}${s.status !== 'active' ? ' · ' + esc(s.status) : ''} · last OK ${rel(s.last_ok)}</div>
      ${s.last_error ? `<div class="err">${esc(s.last_error)}</div>` : ''}</div>
      <div class="sn"><b>${s.new_7d}</b>new this week</div></div>`).join('')}</div>`;
}

// ---------- render loop ----------
async function ensure(id) {
  if (!DATA[id]) DATA[id] = await fetch(`data/${id}.json?t=${Date.now()}`).then(r => r.json()).catch(() => []);
  if (!IDEAS[id]) IDEAS[id] = await fetch(`data/${id}-ideas.json?t=${Date.now()}`).then(r => r.json()).catch(() => []);
}
async function render() {
  await ensure(S.entity);
  renderChrome();
  const v = { overview:viewOverview, ideas:viewIdeas, feed:viewFeed, competitors:viewCompetitors, manual:viewManual, sources:viewSources }[S.view] || viewOverview;
  document.getElementById('main').innerHTML = v();
  renderList();
  const q = document.getElementById('q');
  if (q) q.oninput = ev => { S.q = ev.target.value; renderList(); };
  for (const id of ['from', 'to']) { const el = document.getElementById(id); if (el) el.onchange = ev => set({ [id]: ev.target.value }); }
}
function set(p) {
  const jump = ('entity' in p && p.entity !== S.entity) || ('view' in p && p.view !== S.view);
  if ('entity' in p && p.entity !== S.entity) { S.comp = 'ALL'; store('sh-entity', p.entity); }
  if ('view' in p && p.view !== S.view && !('label' in p)) { S.label = 'ALL'; S.q = ''; }
  Object.assign(S, p);
  if (location.hash !== `#${S.entity}/${S.view}`) history.pushState(null, '', `#${S.entity}/${S.view}`);
  render();
  if (jump) window.scrollTo(0, 0);
}
document.addEventListener('click', ev => {
  const d = ev.target.closest('[data-detail]');
  if (d) { ev.preventDefault(); openDetail(d.dataset.detail); return; }
  if (ev.target.closest('[data-close]') || ev.target.classList.contains('modal')) { closeDetail(); return; }
  if (ev.target.closest('[data-theme-toggle]')) {
    document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
    store('sh-theme', document.documentElement.dataset.theme); renderChrome(); return;
  }
  const b = ev.target.closest('[data-set]');
  if (b) { ev.preventDefault(); set(JSON.parse(b.dataset.set)); }
});
desk.addEventListener('change', () => META && render());
window.addEventListener('hashchange', () => {
  const [hEnt, hView] = location.hash.slice(1).split('/');
  const p = {};
  if (META.entities.some(e => e.id === hEnt) && hEnt !== S.entity) p.entity = hEnt;
  if (VIEWS.some(([k]) => k === hView) && hView !== S.view) p.view = hView;
  if (Object.keys(p).length) set(p);
});
(async () => {
  const theme = load('sh-theme'); if (theme) document.documentElement.dataset.theme = theme;
  try { META = await fetch(`data/meta.json?t=${Date.now()}`).then(r => r.json()); }
  catch (e) { document.getElementById('main').innerHTML = '<div class="empty"><h3>Could not load data</h3><p>Try again in a minute.</p></div>'; return; }
  const [hEnt, hView] = location.hash.slice(1).split('/');
  const saved = hEnt || load('sh-entity');
  S.entity = META.entities.some(e => e.id === saved) ? saved : META.entities[0].id;
  if (VIEWS.some(([k]) => k === hView)) S.view = hView;
  render();
})();
</script>
